<form id="poemForm">
<h2>Submit Your Poem</h2>
<input type="text" id="title" placeholder="Poem Title" required><br>
<textarea id="content" placeholder="Write your poem here..." rows="8" required></textarea><br>
<input type="text" id="category" placeholder="Category" required><br>
<input type="text" id="author" placeholder="Author Name" required><br>
<button type="submit">Submit Poem</button>
</form>

</body>
